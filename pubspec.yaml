name: botola_max
description: UEFA Champions League competitions, matches and much more

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  get: ^4.7.3
  provider: ^6.1.5
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  gap: ^3.0.1
  visibility_detector: ^0.4.0+2
  timeago: ^3.7.1
  collection: ^1.19.1
  loading_animation_widget: ^1.3.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  animated_theme_switcher: ^2.0.10
  dio: ^5.11.1
  animated_flip_counter: ^0.3.4
  power_geojson: ^3.47.1+2
  connectivity_plus: ^7.3.1
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
  wakelock_plus: ^1.3.2
  video_player: ^2.10.0
  audioplayers: ^6.4.0

  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.10+1

# dart pub global run rename setAppName --value ""
# dart pub global run rename setBundleId --value com.ymrabtiapps.botola_max

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/Qatar2022Arabic-Bold.ttf
        - asset: assets/fonts/Qatar2022Arabic-Heavy.ttf

  #
